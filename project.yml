# Xcode project spec. Generate the project with:
#   brew install xcodegen && xcodegen generate
name: Slimy
options:
  bundleIdPrefix: de.hyprnode
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  # Privacy manifests are bundle resources. Stated here so every target copies
  # the PrivacyInfo.xcprivacy inside its own source folder (App/, Widget/) and
  # nothing else; the two folders don't overlap, so each is included once.
  fileTypes:
    xcprivacy:
      buildPhase: resources
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_LANGUAGE: en
    DEVELOPMENT_TEAM: ""  # Building in Xcode yourself? Pick your team under Signing & Capabilities.
targets:
  Slimy:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Slimy
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en]
        UIAppFonts: [PixelifySans-Regular.ttf, PixelifySans-Bold.ttf]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        NSPhotoLibraryAddUsageDescription: Slimy saves pictures of your slime to your photo library when you ask it to.
        # fetch: background refresh (de.hyprnode.slimy.refresh).
        # processing: the check while charging (de.hyprnode.slimy.power).
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [de.hyprnode.slimy.refresh, de.hyprnode.slimy.power]
        CFBundleURLTypes:
          - CFBundleURLName: de.hyprnode.slimy
            CFBundleURLSchemes: [slimy]
        # Save files from Settings > Backup (SaveFile.format / .fileExtension),
        # so the import picker can offer exactly these files.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: de.hyprnode.slimy.save
            UTTypeDescription: Slimy Save
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [slimysave]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/Slimy.entitlements
      properties:
        com.apple.security.application-groups: [group.de.hyprnode.slimy]
    settings:
      base:
        PRODUCT_NAME: Slimy
        PRODUCT_BUNDLE_IDENTIFIER: de.hyprnode.slimy
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SLIME_APP
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: SlimyWidgets
  SlimyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    settings:
      base:
        PRODUCT_NAME: SlimyWidgets
        PRODUCT_BUNDLE_IDENTIFIER: de.hyprnode.slimy.widgets
        INFOPLIST_FILE: Widget/Info.plist  # generated by tools/make_slime.py (lists the fonts)
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    entitlements:
      path: Widget/SlimyWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.de.hyprnode.slimy]
  SlimyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/SlimyTests
    dependencies:
      - target: Slimy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.hyprnode.slimy.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Slimy:
    build:
      targets:
        Slimy: all
        SlimyWidgets: all
    test:
      targets:
        - SlimyTests
