# Xcode project spec. Generate the project with:
#   brew install xcodegen && xcodegen generate
name: Slimy
options:
  bundleIdPrefix: de.hyprnode
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""  # Building in Xcode yourself? Pick your team under Signing & Capabilities.
targets:
  Slimy:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Slimy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: AccentColor
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [de.hyprnode.slimy.refresh]
        CFBundleURLTypes:
          - CFBundleURLName: de.hyprnode.slimy
            CFBundleURLSchemes: [slimy]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: Slimy
        PRODUCT_BUNDLE_IDENTIFIER: de.hyprnode.slimy
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SLIME_APP
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: SlimyWidgets
  SlimyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    settings:
      base:
        PRODUCT_NAME: SlimyWidgets
        PRODUCT_BUNDLE_IDENTIFIER: de.hyprnode.slimy.widgets
        INFOPLIST_FILE: Widget/Info.plist  # generated by tools/make_slime.py (lists the fonts)
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
schemes:
  Slimy:
    build:
      targets:
        Slimy: all
        SlimyWidgets: all
