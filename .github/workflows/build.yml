name: Build

# Every branch and pull request is built and tested. Only a push to main
# publishes a release with the IPAs and the Android APK, and only when the
# unit tests, the server tests, the IPA build and the Android build all
# passed. Screenshots are taken on every run and, for pushes, replace the
# iPhone set (top level) or the Android set (android/) of the
# "ci-screenshots" branch.
on:
  push:
    branches-ignore: [ci-screenshots]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push replaces a running build of the same branch. On main every
  # push becomes a release, so each run there gets a group of its own and is
  # never cancelled or held back.
  group: build-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  art:
    name: Check slime fonts and puzzles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools uharfbuzz pillow
      - name: Rebuild sprites and fonts
        run: python tools/make_slime.py
      - name: Every timer string must become exactly one frame
        run: python tools/verify_fonts.py
      - name: Every Garden Puzzle level must be solvable
        run: python tools/check_puzzles.py

  server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test
        working-directory: server
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; fi
          npm test

  site:
    name: Build website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No dependencies: build.mjs uses Node built-ins only. It reads the
      # sprites, the pixel font and the app icon from the app's folders, so
      # this also catches an app change that moves them.
      - name: Build
        run: node site/build.mjs
      - name: Check the output
        run: |
          for file in index.html 404.html f/index.html admin/index.html sprites.json sitemap.xml robots.txt; do
            if [ ! -f "site/dist/$file" ]; then
              echo "::error::site/dist/$file is missing"
              exit 1
            fi
          done
          if ! ls site/dist/fonts/*.ttf >/dev/null 2>&1; then
            echo "::error::site/dist/fonts has no fonts"
            exit 1
          fi

  tests:
    name: Unit tests (simulator)
    needs: art
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Test
        run: |
          set -o pipefail
          udid=$(xcrun simctl list devices available | grep -m1 -E "^\s+iPhone" | grep -oE '[0-9A-F]{8}-[0-9A-F-]{27}')
          echo "Simulator: $udid"
          xcodebuild test \
            -project Slimy.xcodeproj \
            -scheme Slimy \
            -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log | grep -E "error:|Test Suite .* (passed|failed)|Executed [0-9]+ test|TEST (SUCCEEDED|FAILED)" || true
          grep -q "TEST SUCCEEDED" xcodebuild.log
      - name: Report errors
        if: failure()
        run: bash tools/ci_report.sh xcodebuild.log

  ipa:
    name: Build IPA
    needs: art
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project Slimy.xcodeproj \
            -scheme Slimy \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E "error:|warning: .*Slimy|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log
      - name: Report errors
        if: failure()
        run: bash tools/ci_report.sh xcodebuild.log
      - name: Check privacy manifests
        run: |
          app=build/Build/Products/Release-iphoneos/Slimy.app
          for manifest in "$app/PrivacyInfo.xcprivacy" "$app/PlugIns/SlimyWidgets.appex/PrivacyInfo.xcprivacy"; do
            if [ ! -f "$manifest" ]; then
              echo "::error::Missing $manifest"
              exit 1
            fi
            plutil -lint "$manifest"
          done
      - name: Package IPAs
        run: |
          app=build/Build/Products/Release-iphoneos/Slimy.app
          # Plain unsigned build, as before.
          mkdir -p plain/Payload && cp -R "$app" plain/Payload/
          (cd plain && zip -qry ../Slimy-unsigned.ipa Payload)
          # Ad-hoc signed with the App Group entitlement, so sideloading
          # tools can see that app and widgets share their save.
          codesign --force --sign - --entitlements Widget/SlimyWidgets.entitlements "$app/PlugIns/SlimyWidgets.appex"
          codesign --force --sign - --entitlements App/Slimy.entitlements "$app"
          codesign -d --entitlements - "$app" || true
          mkdir -p Payload && cp -R "$app" Payload/
          zip -qry Slimy.ipa Payload
          ls -lh Slimy.ipa Slimy-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Slimy-ipa
          path: |
            Slimy.ipa
            Slimy-unsigned.ipa

  android:
    name: Android (tests, APK, screenshots)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # The repo has no Gradle wrapper: this installs Gradle 8.9 and caches
      # the Gradle home (dependencies, build cache) between runs.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      # Robolectric fetches its Android runtime from Maven Central into ~/.m2.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml') }}
      - name: Android SDK
        run: |
          # Preinstalled on GitHub's Ubuntu runners; Gradle adds missing packages itself.
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$sdk" ]; then
            echo "::error::No Android SDK at $sdk"
            exit 1
          fi
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "sdk.dir=$sdk" > android/local.properties
      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SLIMY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SLIMY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SLIMY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SLIMY_KEY_PASSWORD }}
        run: |
          # android/app/build.gradle.kts signs with SLIMY_KEYSTORE when that
          # file exists; the passwords reach only the build step below.
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            keystore="$RUNNER_TEMP/slimy-release.keystore"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
            echo "SLIMY_KEYSTORE=$keystore" >> "$GITHUB_ENV"
            echo "Release signing: the Slimy key from the repository secrets."
          else
            echo "::warning title=Slimy.apk is signed with a debug key::Set the repository secrets SLIMY_KEYSTORE_BASE64, SLIMY_KEYSTORE_PASSWORD, SLIMY_KEY_ALIAS and SLIMY_KEY_PASSWORD to sign it with the release key. Every run makes a new debug key, and Android only installs an update over an APK signed with the same key."
          fi
      - name: Test, record screenshots and build the APK
        working-directory: android
        env:
          SLIMY_KEYSTORE_PASSWORD: ${{ secrets.SLIMY_KEYSTORE_PASSWORD }}
          SLIMY_KEY_ALIAS: ${{ secrets.SLIMY_KEY_ALIAS }}
          SLIMY_KEY_PASSWORD: ${{ secrets.SLIMY_KEY_PASSWORD }}
        # recordRoborazziDebug runs the unit tests once, with recording on:
        # every screen in light and dark goes to app/build/outputs/roborazzi.
        run: gradle :model:test :app:testDebugUnitTest :app:recordRoborazziDebug :app:assembleRelease --console=plain
      - name: Package Slimy.apk
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Slimy.apk
          ls -lh Slimy.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1)"
          if [ -n "$apksigner" ]; then
            "$apksigner" verify --print-certs Slimy.apk | grep -E "Signer #1 certificate (DN|SHA-256)" || true
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-reports
          path: |
            android/model/build/reports/tests/
            android/app/build/reports/tests/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Slimy-apk
          path: Slimy.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshots
          path: android/app/build/outputs/roborazzi/*.png
          if-no-files-found: ignore
      - name: Publish to the ci-screenshots branch
        if: github.event_name == 'push'
        # Nice to have: a failed push never fails the build or holds up the release.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/ci_publish_screenshots.sh android/app/build/outputs/roborazzi android

  release:
    name: Publish release
    # The website's Download buttons serve the newest release, so a build
    # whose tests failed must never become one.
    needs: [ipa, tests, server, android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Slimy-ipa
      - uses: actions/download-artifact@v4
        with:
          name: Slimy-apk
      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          # Tag the commit that was built, not whatever main points at now.
          target_commitish: ${{ github.sha }}
          name: Slimy build ${{ github.run_number }}
          prerelease: true
          files: |
            Slimy.ipa
            Slimy-unsigned.ipa
            Slimy.apk
          body: |
            Build of ${{ github.sha }}.
            Slimy.ipa: ad-hoc signed with the App Group entitlement (needed for the Home Screen widgets). Install it with Sideloadly and your Apple ID.
            Slimy-unsigned.ipa: the same app without entitlements. Use it if your sideloading tool rejects the App Group; the app then keeps its save inside the app and the Home Screen widgets show a placeholder.
            Slimy.apk: the Android beta, for Android 8 or later. Open it on the phone and allow installing from that source when Android asks. A newer APK installs over the old one and keeps the save.

  screenshots:
    name: Screenshots (simulator)
    needs: art
    runs-on: macos-15
    timeout-minutes: 60
    # Nice to have: a failure here never fails the run or holds up the IPA.
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Pick an iPhone Pro simulator
        id: sim
        run: echo "udid=$(bash tools/ci_simulator.sh)" >> "$GITHUB_OUTPUT"
      - name: Build (Debug, simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -project Slimy.xcodeproj \
            -scheme Slimy \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build | tee xcodebuild.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log
      - name: Report errors
        if: failure()
        run: bash tools/ci_report.sh xcodebuild.log
      - name: Take screenshots
        run: bash tools/ci_screenshots.sh "${{ steps.sim.outputs.udid }}" screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/*.png
          if-no-files-found: ignore
      - name: Publish to the ci-screenshots branch
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/ci_publish_screenshots.sh screenshots ios
