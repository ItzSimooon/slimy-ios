<!doctype html>
<html lang="en">
<head>
<!-- @head -->
<title>Page not found · Slimy</title>
<meta name="description" content="This page doesn't exist. The slime looked everywhere.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://slime.hyprnode.de/404">
</head>
<body>
<!-- @header -->
<main id="main" class="wrap">
  <section class="lost" aria-labelledby="lost-title">
    <p class="lost-bubble" aria-hidden="true">i looked everywhere.</p>
    <canvas class="lost-slime" data-slime data-skin="mine" data-anim="sad" data-tap="confused" data-tap-target width="24" height="20" aria-hidden="true"></canvas>
    <h1 id="lost-title">This page wandered off.</h1>
    <p class="lede">The address might be mistyped, or the page has moved. Your slime is fine, it just couldn't find it either.</p>
    <div class="lost-actions">
      <a class="btn" href="/">Go to the home page</a>
      <a class="btn btn-tint" href="/support">Get help</a>
    </div>
  </section>
</main>
<!-- @footer -->
</body>
</html>
